services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: release
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
    # The release image may not ship curl, so probe with bun itself.
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
        compress: "true"
        tag: "scrum-poker-backend"
    restart: unless-stopped
