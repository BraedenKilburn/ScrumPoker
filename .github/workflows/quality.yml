name: Quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run fmt:check

      - name: Type-check
        run: bun run type-check

      - name: Test
        run: bun run test

      - name: Build frontend
        run: bun run build

      - name: Audit dependencies
        run: bun run audit

      - name: Validate Compose files
        run: bun run validate:compose

      - name: Check deployment shell scripts
        run: bun run validate:shell

      - name: Build backend release image
        run: docker build --target release --file backend/Dockerfile .
