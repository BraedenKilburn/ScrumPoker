<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎰</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    />
    <title>Scrum Poker</title>
    <meta name="theme-color" content="#f1f5f9" />
    <!-- First paint: set the appearance before the bundle loads so the page
         never paints light-then-dark (or the reverse). Same rule as
         resolveAppearance() in src/composables/useAppearance.ts; the
         contract test in src/composables/__tests__ keeps them in step. -->
    <script>
      (function () {
        var preference = null;
        try {
          preference = localStorage.getItem("theme-preference");
        } catch (_) {}
        var dark =
          preference === "dark" ||
          (preference !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        root.classList.toggle("p-dark", dark);
        root.style.colorScheme = dark ? "dark" : "light";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = dark ? "#18181b" : "#f1f5f9";
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
